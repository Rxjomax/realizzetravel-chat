<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C76E" />
      <stop offset="50%" stop-color="#E2A947" />
      <stop offset="100%" stop-color="#C5892C" />
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Deep Navy #040e21 -->
  <rect width="500" height="500" fill="#040e21" rx="48" />

  <!-- Swoosh line to star -->
  <path d="M 285 208 C 330 205, 370 185, 385 160" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- 4-point Star -->
  <g transform="translate(395, 148)" filter="url(#starGlow)">
    <!-- 4-point star shape -->
    <path d="M 0 -38 Q 0 0 38 0 Q 0 0 0 38 Q 0 0 -38 0 Q 0 0 0 -38 Z" fill="#F4CA74" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- REALIZZE Typography -->
  <text
    x="250"
    y="270"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="64"
    fill="url(#goldGrad)"
    letter-spacing="5"
  >
    REALIZZE
  </text>

  <!-- travel Typography -->
  <text
    x="250"
    y="336"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="600"
    font-size="48"
    fill="#FFFFFF"
    letter-spacing="3"
  >
    travel
  </text>
</svg>
